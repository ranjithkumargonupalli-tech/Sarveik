<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#7c6dfa" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sarveik" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>Sarveik Chat – Instant Messaging</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#7c6dfa;--accent2:#fa6dbe;--gold:#f5b942;--green:#42f5a4;--red:#f54242;
  --sidebar-w:360px;--radius:20px;--radius-sm:12px;--radius-xs:8px;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'DM Mono',ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --bg:#f0f2f9;--bg2:#fff;--bg3:#e8eaf4;
  --surface:rgba(255,255,255,.75);--surface2:rgba(255,255,255,.4);
  --border:rgba(0,0,0,.06);--border2:rgba(0,0,0,.1);
  --text:#111827;--text2:#4b5563;--text3:#9ca3af;
  --msg-out:linear-gradient(135deg,#7c6dfa,#5a4de0);--msg-out-text:#fff;
  --msg-in:#fff;--msg-in-text:#1f2937;
  --shadow:0 8px 32px rgba(124,109,250,.08);--shadow2:0 2px 12px rgba(0,0,0,.06);
}
body.dark{--bg:#0c0d14;--bg2:#131521;--bg3:#1a1c2e;--surface:rgba(20,22,38,.88);--surface2:rgba(255,255,255,.04);--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--text:#f1f3ff;--text2:#9ba3c0;--text3:#555a7a;--msg-in:#1e2138;--msg-in-text:#d1d9ff;--shadow:0 8px 32px rgba(0,0,0,.4);--shadow2:0 2px 12px rgba(0,0,0,.3)}
body.ocean{--bg:#0a1628;--bg2:#0d1f3c;--bg3:#112241;--surface:rgba(13,31,60,.9);--surface2:rgba(255,255,255,.04);--border:rgba(100,200,255,.08);--border2:rgba(100,200,255,.14);--text:#e0f4ff;--text2:#7ec8e3;--text3:#3a7a9c;--msg-out:linear-gradient(135deg,#0891b2,#0e7490);--msg-in:#112241;--msg-in-text:#cde8f5;--shadow:0 8px 32px rgba(0,0,0,.5);--shadow2:0 2px 12px rgba(0,0,0,.3);--accent:#22d3ee;--accent2:#38bdf8}
body.sunset{--bg:#1a0a0a;--bg2:#2a1010;--bg3:#331515;--surface:rgba(42,16,16,.9);--surface2:rgba(255,100,50,.04);--border:rgba(255,120,60,.1);--border2:rgba(255,120,60,.18);--text:#fff5f0;--text2:#ffb49a;--text3:#7a4030;--msg-out:linear-gradient(135deg,#ea580c,#dc2626);--msg-in:#331515;--msg-in-text:#ffded0;--shadow:0 8px 32px rgba(0,0,0,.5);--shadow2:0 2px 12px rgba(0,0,0,.3);--accent:#fb923c;--accent2:#f43f5e}
body.forest{--bg:#0a160e;--bg2:#0f1f14;--bg3:#152a1a;--surface:rgba(15,31,20,.9);--surface2:rgba(100,255,150,.04);--border:rgba(80,200,100,.08);--border2:rgba(80,200,100,.15);--text:#e8ffee;--text2:#7ecf90;--text3:#3a7a4a;--msg-out:linear-gradient(135deg,#16a34a,#15803d);--msg-in:#152a1a;--msg-in-text:#c8f0d4;--shadow:0 8px 32px rgba(0,0,0,.5);--shadow2:0 2px 12px rgba(0,0,0,.3);--accent:#4ade80;--accent2:#22c55e}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);transition:background .4s,color .4s;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.app{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;height:var(--app-h,100dvh);display:flex;overflow:hidden}

/* ---------- SIDEBAR ---------- */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--border2);display:flex;flex-direction:column;z-index:10;position:relative;min-height:0}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.6}
.sidebar-head{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;flex-shrink:0}
.brand-name{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-sub{font-size:.6rem;font-weight:500;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.sidebar-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.theme-select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:5px 10px;font-family:var(--font);font-size:.72rem;font-weight:500;color:var(--text);cursor:pointer;outline:none;flex:1;min-width:80px}
.theme-select option{background:var(--bg2);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:40px;padding:3px 9px;font-size:.7rem;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap}
.chip .fa-coins{color:var(--gold)}.chip .fa-star{color:var(--accent)}
.icon-btn,.hdr-btn,.tool-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:all .2s;flex-shrink:0;position:relative}
.icon-btn{width:30px;height:30px;font-size:.8rem}
.hdr-btn{width:32px;height:32px;font-size:.8rem}
.tool-btn{width:36px;height:36px;font-size:.9rem}
.icon-btn:hover,.hdr-btn:hover,.tool-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.hdr-btn.danger:hover{background:var(--red);border-color:var(--red)}
.hdr-btn:disabled{opacity:.4;cursor:not-allowed}
.tool-btn.on{background:var(--accent);color:#fff}
.tool-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}
.notif-on{color:var(--green)!important}
.search-wrap{padding:10px 14px;border-bottom:1px solid var(--border)}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:50px;padding:7px 14px}
.search-inner:focus-within{border-color:var(--accent)}
.search-inner i{color:var(--text3);font-size:.8rem}
.search-inner input{flex:1;min-width:0;background:none;border:none;outline:none;font-family:var(--font);font-size:.82rem;color:var(--text)}
.tab-bar{display:flex;padding:8px 12px 0;gap:2px;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:9px 4px;font-size:.74rem;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.3px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.badge-tab,.badge{background:var(--accent);color:#fff;border-radius:50px;font-size:.6rem;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;display:inline-block}
.badge-tab{margin-left:4px}
.list-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.list-panel{display:none}.list-panel.visible{display:block}
.list-section-label{padding:12px 18px 4px;font-size:.65rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3)}
.hint{padding:16px 14px;color:var(--text3);font-size:.78rem;text-align:center}
.conv-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-radius:var(--radius-sm);margin:2px 6px;transition:background .2s,transform .2s;border:1px solid transparent;position:relative}
.conv-item:hover{background:var(--surface2);transform:translateX(3px)}
.conv-item:active{background:var(--surface2)}
.conv-item.active{background:linear-gradient(90deg,rgba(124,109,250,.1),transparent);border-color:rgba(124,109,250,.15)}
.conv-item.flash{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(124,109,250,.3)}100%{background:transparent}}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:#fff;flex-shrink:0}
.avatar.group-av{background:linear-gradient(135deg,var(--gold),#e8940a);font-size:.9rem}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.online-dot,.dot-online{background:var(--green);border-radius:50%;animation:blink 2s infinite}
.avatar .online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border:2px solid var(--bg2)}
.dot-online{width:6px;height:6px;display:inline-block}
.dot-online.off{background:var(--text3);animation:none}
@keyframes blink{50%{opacity:.3}}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-sub{font-size:.74rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-sub.unread{color:var(--text);font-weight:600}
.conv-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-time{font-size:.6rem;color:var(--text3);font-family:var(--mono)}
.req-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;margin:4px 6px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm)}
.req-name{font-weight:600;font-size:.82rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:flex;gap:4px}
.btn{border:none;border-radius:var(--radius-xs);padding:6px 12px;font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e09a20);color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn-sm{padding:5px 9px;font-size:.7rem}
.sidebar-footer{padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--border)}

/* ---------- CHAT ---------- */
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;z-index:5;min-width:0;min-height:0}
.chat-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;padding-top:calc(12px + var(--sat));background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);min-height:64px;flex-shrink:0}
.back-btn{display:none;width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chat-header-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.chat-avatar-h{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:.95rem}
.chat-avatar-h img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat-user-name{font-size:.95rem;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-user-status{font-size:.7rem;color:var(--text3);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.chat-user-status.is-typing{color:var(--accent);font-weight:600}
.chat-header-right{display:flex;gap:4px;align-items:center;flex-shrink:0}
.status-pill{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border2);border-radius:50px;padding:3px 10px;font-size:.65rem;font-weight:600;color:var(--text2);white-space:nowrap}
.pulse{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 2s infinite}
.pulse.off{background:var(--gold);animation:none}

/* messages area */
.messages-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 20px;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-height:0}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text3);padding:40px}
.empty-icon{width:72px;height:72px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:14px}
.empty-state h3{font-size:1rem;color:var(--text2);margin-bottom:4px}
.empty-state p{font-size:.8rem}

/* THE BUBBLE — direction is now locked by margin:auto, not just flex */
.msg{display:flex;flex-direction:column;width:fit-content;max-width:min(560px,82%);animation:msgIn .25s ease-out;position:relative;flex:0 0 auto;touch-action:pan-y}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.msg.in{align-self:flex-start;align-items:flex-start;margin-left:0;margin-right:auto}
.msg.out{align-self:flex-end;align-items:flex-end;margin-left:auto;margin-right:0}
.msg.in .msg-meta,.msg.in .msg-actions{justify-content:flex-start}
.msg.out .msg-meta,.msg.out .msg-actions{justify-content:flex-end}
.msg.sending .msg-bubble{opacity:.7}
.msg-bubble{padding:8px 13px;border-radius:18px;word-break:break-word;overflow-wrap:anywhere;line-height:1.45;font-size:.9rem;position:relative;width:fit-content;max-width:100%;touch-action:pan-y;transition:transform .18s}
.msg-text{white-space:pre-wrap;display:block}
.msg-text:empty{display:none}
.msg.out+.msg.out,.msg.in+.msg.in{margin-top:-3px}
.msg.out .msg-bubble{background:var(--msg-out);color:var(--msg-out-text);border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(124,109,250,.25)}
.msg.in .msg-bubble{background:var(--msg-in);color:var(--msg-in-text);border-bottom-left-radius:4px;border:1px solid var(--border2);box-shadow:var(--shadow2)}
.msg-bubble.boosted{outline:1.5px solid var(--gold);box-shadow:0 0 18px rgba(245,185,66,.35)}
.msg.hl .msg-bubble{animation:hl 1.4s ease-out}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px var(--accent),0 0 22px var(--accent)}100%{}}
.boost-badge{position:absolute;top:-9px;right:-7px;background:var(--gold);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.6rem}
.msg-file{margin:6px 0 2px;border-radius:var(--radius-xs);overflow:hidden;max-width:280px;background:var(--bg3);border:1px solid var(--border2);cursor:pointer}
.msg-file img,.msg-file video{width:100%;max-height:260px;object-fit:cover;display:block;background:#000;-webkit-user-drag:none;user-drag:none}
.msg-file.photo{min-height:60px}
.file-icon{display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:6px;color:var(--text2);white-space:normal}
.file-icon i{font-size:2.4rem;color:var(--accent)}
.file-icon span{font-size:.7rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-meta{display:flex;align-items:center;gap:5px;margin-top:2px;padding:0 4px;opacity:.75}
.msg:hover .msg-meta,.msg.show-actions .msg-meta{opacity:1}
.msg-time{font-size:.6rem;color:var(--text3);font-family:var(--mono)}
.msg-status{font-size:.62rem}
.msg-status .fa-check{color:var(--text3)}
.msg-status .fa-check-double{color:var(--green);animation:tickPop .35s ease-out}
.msg-status .fa-spinner{color:var(--accent);animation:spin 1s linear infinite}
.msg-status .fa-exclamation-circle{color:var(--red)}
@keyframes tickPop{from{transform:scale(.4);opacity:0}}
.seen-label{font-size:.6rem;font-weight:600;color:var(--green);font-family:var(--mono);animation:msgIn .25s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
.msg-actions{display:flex;gap:4px;position:absolute;top:-16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2}
.msg.out .msg-actions{right:0}
.msg.in .msg-actions{left:0}
.msg:hover .msg-actions,.msg.show-actions .msg-actions{opacity:1;pointer-events:all}
.msg.swiping .msg-actions{opacity:0;pointer-events:none}
.msg-act{background:var(--surface);border:1px solid var(--border2);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.65rem;color:var(--text2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.msg-act:hover{background:var(--accent);color:#fff}
.msg-act.boost{color:var(--gold)}
.msg-act.del{color:var(--red)}
.msg-act.del:hover{background:var(--red);color:#fff}
.reply-indicator{font-size:.7rem;opacity:.9;padding:3px 8px;border-left:2px solid var(--accent2);background:rgba(0,0,0,.12);border-radius:4px;margin-bottom:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.reply-preview{display:none;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:var(--radius-xs);padding:6px 10px;font-size:.78rem;color:var(--text2);margin-bottom:8px}
.reply-preview.visible{display:flex}
.reply-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-cancel{cursor:pointer;color:var(--red);padding:0 4px}

/* voice player (completes the truncated rule) */
.voice{display:flex;align-items:center;gap:10px;min-width:220px;max-width:100%;padding:2px 0}
.voice-btn{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:.85rem;transition:transform .15s}
.voice-btn:active{transform:scale(.92)}
.voice-btn:disabled{opacity:.5;cursor:not-allowed}
.msg.in .voice-btn{background:var(--accent);color:#fff}
.voice-track{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer;min-width:100px}
.voice-track i{display:block;flex:1;min-width:2px;background:currentColor;border-radius:2px;opacity:.35;transition:opacity .15s}
.voice-track i.on{opacity:1}
.voice-time{font-size:.68rem;font-family:var(--mono);opacity:.8;min-width:34px;text-align:right}

/* typing indicator inside messages area */
.typing-bubble{display:flex;align-items:center;gap:4px;padding:10px 14px;background:var(--msg-in);border:1px solid var(--border2);border-radius:18px;border-bottom-left-radius:4px;box-shadow:var(--shadow2);align-self:flex-start;width:fit-content}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:typingBounce 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:.15s}
.typing-bubble span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* input area */
.input-area{padding:10px 16px calc(10px + var(--sab));background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border2);flex-shrink:0}
.input-row{display:flex;align-items:flex-end;gap:6px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:24px;padding:6px 8px 6px 6px}
.input-row:focus-within{border-color:var(--accent)}
.msg-input{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:.92rem;color:var(--text);resize:none;max-height:120px;line-height:1.4;padding:8px 4px;min-height:24px}
.send-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:.95rem;transition:transform .15s,opacity .2s}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.record-btn.recording{background:var(--red);color:#fff;border-color:var(--red);animation:recPulse 1.4s infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 6px rgba(245,66,66,.25)}}
.record-time{font-family:var(--mono);font-size:.8rem;color:var(--red);font-weight:700;flex:1;text-align:center;display:none}
.recording .record-time{display:block}
.recording .msg-input{display:none}

/* scroll to bottom button */
.scroll-bottom{position:absolute;right:20px;bottom:90px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);z-index:8}
.scroll-bottom.show{display:flex}
.scroll-bottom .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50px;font-size:.6rem;font-weight:700;padding:1px 5px;min-width:16px}

/* toasts */
.toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:500;box-shadow:var(--shadow);animation:toastIn .3s ease-out;pointer-events:auto;max-width:100%}
.toast.error{background:var(--red)}.toast.info{background:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}}

/* responsive */
@media (max-width:900px){
  .sidebar{width:100%;min-width:100%}
  .chat-main{display:none}
  body.chat-open .sidebar{display:none}
  body.chat-open .chat-main{display:flex}
  .back-btn{display:flex}
  .messages-area{padding:12px}
  .chat-header{padding:10px 14px;padding-top:calc(10px + var(--sat))}
  .input-area{padding:8px 10px calc(8px + var(--sab))}
  .msg{max-width:88%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-shield-alt"></i></div>
        <div>
          <div class="brand-name">Sarveik</div>
          <div class="brand-sub">Instant Messaging</div>
        </div>
      </div>
      <div class="sidebar-controls">
        <select class="theme-select" id="themeSelect" aria-label="Theme">

    <div class="tab-bar" role="tablist">

    <div class="sidebar-footer">
      <a href="friends.html" class="btn btn-accent" style="width:100%;justify-content:center;text-decoration:none"><i class="fas fa-user-plus"></i> Find people</a>

  </aside>

  <!-- ==================== CHAT ==================== -->
  <main class="chat-main" id="chatMain">
    <header class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn" id="backBtn" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-avatar-h" id="chatAvatar">?</div>
        <div style="min-width:0">
          <div class="chat-user-name" id="chatName">Sarveik</div>
          <div class="chat-user-status" id="chatStatus"><span class="dot-online off"></span> Select a conversation</div>
        </div>

      <div class="chat-header-right">
        <span class="status-pill" id="statusPill"><span class="pulse off"></span> Offline</span>

      </div>
      <div class="input-row" id="inputRow">
        <button class="tool-btn" id="attachBtn" title="Attach file">
          <i class="fas fa-paperclip"></i>
          <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip,.txt" />
        </button>
        <button class="tool-btn record-btn" id="recordBtn" title="Record voice"><i class="fas fa-microphone"></i></button>
        <span class="record-time" id="recordTime">0:00</span>
        <textarea class="msg-input" id="msgInput" rows="1" placeholder="Type a message…" disabled></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; };
const safeParse = (raw, fb) => { try { const v = JSON.parse(raw); return v == null ? fb : v; } catch(_) { return fb; } };
const store = {
  get: (k, fb) => safeParse(localStorage.getItem(k), fb),
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
};
const debounce = (fn, w=300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), w); }; };
const timeFmt = ts => { if (!ts) return ''; const d = new Date(ts); if (isNaN(d)) return ''; return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
const dayKey = ts => { const d = new Date(ts); if (isNaN(d)) return ''; return d.toDateString(); };
const dayLabel = ts => {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Today';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
};
const timeAgo = ts => { if (!ts) return ''; const s = Math.floor((Date.now()-ts)/1000); if (s < 60) return 'now'; if (s < 3600) return Math.floor(s/60)+'m'; if (s < 86400) return Math.floor(s/3600)+'h'; if (s < 604800) return Math.floor(s/86400)+'d'; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
const initial = n => (n || '?').trim().charAt(0).toUpperCase() || '?';
const normId = v => (v == null || v === '') ? null : String(v);

function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = 'toast' + (type==='error'?' error':type==='info'?' info':'');
  t.setAttribute('role','status'); t.textContent = msg;
  $('toastStack').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),320); }, 3200);
}

/* =========================================================
   API + CSRF  (mirrors friends.html)
   ========================================================= */
let csrfToken = null;
async function fetchCsrf(){ try{ const r = await fetch('/api/csrf-token',{credentials:'include'}); if (r.ok) csrfToken = (await r.json()).csrfToken; }catch(_){} }
async function api(url, opt={}, retry=true){
  if (opt.body && typeof opt.body === 'object' && !(opt.body instanceof FormData)){
    opt.body = JSON.stringify(opt.body);
    opt.headers = { ...opt.headers, 'Content-Type':'application/json' };
  }
  if (opt.method && opt.method !== 'GET'){
    if (!csrfToken) await fetchCsrf();
    opt.headers = { ...opt.headers, 'X-CSRF-Token': csrfToken };
  }
  let res;
  try { res = await fetch(url, { ...opt, credentials:'include' }); }
  catch(_) { throw new Error('Network error — check your connection.'); }
  if (!res.ok){
    if (res.status === 403 && retry){ csrfToken = null; await fetchCsrf(); return api(url, opt, false); }
    let msg = 'Error ' + res.status;
    try { const ct = res.headers.get('content-type');
      if (ct && ct.includes('json')) { const j = await res.json(); msg = j.message || j.error || msg; }
      else { const t = await res.text(); if (t) msg = t; }
    } catch(_){}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  const ct = res.headers.get('content-type');
  return ct && ct.includes('json') ? res.json() : res.text();
}

/* =========================================================
   STATE
   ========================================================= */
const socket = io({ withCredentials: true });
let me = { id:null, username:null, display_name:null };
let friends = [];
let groups = [];
let requests = [];
let unread = new Map();           // friendId -> count
let groupUnread = new Map();      // groupId  -> count
let online = new Map();           // friendId -> 'online'|'away'|'busy'|'offline'
let currentType = null;           // 'friend' | 'group' | null
let currentId   = null;
let currentName = '';
let currentIsGroup = false;
let currentAvatarUrl = null;
let messages = [];                // normalized, in chronological order
let pendingByTemp = new Map();    // tempId -> normalized message
const renderedIds = new Set();    // real ids already in DOM
let oldestTs = null;
let loadingMore = false;
let replyTarget = null;
let lastTypingEmit = 0;
let typingTimer = null;
let recorder = null, recChunks = [], recStart = 0, recTimer = null;

/* =========================================================
   DOM REFS
   ========================================================= */
const messagesArea = $('messagesArea');
const emptyState   = $('emptyState');
const msgInput     = $('msgInput');
const sendBtn      = $('sendBtn');

/* =========================================================
   THEME + APP HEIGHT (iOS)
   ========================================================= */
const THEMES = ['light','dark','ocean','sunset','forest'];
function applyTheme(t){
  THEMES.forEach(x => document.body.classList.remove(x));
  if (t !== 'light') document.body.classList.add(t);
  store.set('sarveik_theme', t);
  $('themeSelect').value = t;
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', {light:'#7c6dfa',dark:'#0c0d14',ocean:'#0a1628',sunset:'#1a0a0a',forest:'#0a160e'}[t] || '#7c6dfa');
}
$('themeSelect').addEventListener('change', e => applyTheme(e.target.value));
applyTheme(store.get('sarveik_theme','light'));

function setAppH(){
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
setAppH();
window.addEventListener('resize', setAppH);
window.addEventListener('orientationchange', () => setTimeout(setAppH, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppH);

/* =========================================================
   SERVICE WORKER + NOTIFICATIONS
   ========================================================= */
let swReg = null;
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(r => swReg = r).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'open-chat' && m.friendId) openChat('friend', m.friendId);
    if (m.type === 'open-chat' && m.groupId) openChat('group', m.groupId);
  });
}
function permState(){ return 'Notification' in window ? Notification.permission : 'unsupported'; }
function refreshNotifBtn(){
  const b = $('notifBtn');
  if (permState() === 'granted'){ b.classList.add('notif-on'); b.innerHTML = '<i class="fas fa-bell"></i>'; }
  else { b.classList.remove('notif-on'); b.innerHTML = '<i class="far fa-bell"></i>'; }
}
refreshNotifBtn();
$('notifBtn').addEventListener('click', async () => {
  if (!('Notification' in window)){ showToast('Notifications not supported', 'error'); return; }
  const p = await Notification.requestPermission();
  refreshNotifBtn();
  if (p === 'granted') showToast('Notifications enabled 🔔');
});

/* =========================================================
   NORMALIZE  (handles every shape the server might send)
   ========================================================= */
function normMsg(m){
  if (!m || typeof m !== 'object') return null;
  const reply = m.reply || m.replyTo || m.reply_to || null;
  return {
    id:        m.id ?? m._id ?? m.tempId ?? null,
    tempId:    m.tempId ?? null,
    from:      normId(m.from ?? m.fromId ?? m.from_id ?? m.senderId ?? m.sender_id ?? m.userId ?? m.user_id ?? (m.fromUser && m.fromUser.id) ?? (m.sender && m.sender.id)),
    fromName:  m.fromName ?? m.fromUsername ?? (m.fromUser && (m.fromUser.display_name || m.fromUser.username)) ?? (m.sender && (m.sender.display_name || m.sender.username)) ?? null,
    to:        normId(m.to ?? m.toId ?? m.to_id ?? m.recipient_id ?? m.recipientId),
    groupId:   normId(m.groupId ?? m.group_id),
    message:   m.message ?? m.content ?? m.text ?? m.body ?? '',
    fileUrl:   m.fileUrl ?? m.file_url ?? m.url ?? null,
    fileType:  m.fileType ?? m.file_type ?? m.type ?? null,
    fileName:  m.fileName ?? m.file_name ?? m.name ?? null,
    fileSize:  m.fileSize ?? m.file_size ?? null,
    createdAt: m.createdAt ?? m.created_at ?? m.timestamp ?? m.time ?? null,
    status:    m.status ?? null,
    boosted:   !!(m.boosted || m.is_boosted),
    reply:     reply ? {
      id: reply.id ?? reply.messageId ?? null,
      from: normId(reply.from ?? reply.fromId ?? reply.senderId),
      fromName: reply.fromName ?? reply.fromUsername ?? null,
      text: reply.message ?? reply.text ?? reply.content ?? ''
    } : null
  };
}
const tsOf = m => { if (!m || !m.createdAt) return Date.now(); const t = new Date(m.createdAt).getTime(); return isNaN(t) ? Date.now() : t; };

/* =========================================================
   THE ALIGNMENT FIX — single source of truth
   ========================================================= */
function myId(){
  if (me && me.id != null) return normId(me.id);
  try { const u = store.get('sarveik_me', null); if (u && u.id != null) return normId(u.id); } catch(_){}
  return null;
}
function isMine(m){
  if (!m) return false;
  if (m.mine === true || m.out === true || m.own === true || m.isOwn === true) return true;
  if (m.isMine === false) return false;
  const a = m.from == null ? null : normId(m.from);
  const b = myId();
  if (a === null || b === null) return false;
  return a === b || a.replace(/^user:/,'') === b.replace(/^user:/,'');
}
function dirClass(m){ return isMine(m) ? 'out' : 'in'; }

/* Run after every render / profile-load / reconnect. */
function fixMessageSides(root){
  const meId = myId();
  const scope = (root && root.querySelectorAll) ? root : document;
  scope.querySelectorAll('.msg[data-from]').forEach(el => {
    const from = normId(el.dataset.from);
    if (from === null) return;
    const mine = meId !== null && (from === meId || from.replace(/^user:/,'') === meId.replace(/^user:/,''));
    el.classList.toggle('out',  mine);
    el.classList.toggle('in',  !mine);
  });
}

/* =========================================================
   SIDEBAR — render conversations, groups, requests
   ========================================================= */
function avatarHtml(name, url, cls='avatar'){
  if (url) return `<div class="${cls}"><img src="${esc(url)}" alt="" onerror="this.remove()"></div>`;
  return `<div class="${cls}">${esc(initial(name))}</div>`;
}
function statusDot(status){
  if (status === 'online') return '<span class="online-dot"></span>';
  return '';
}
function renderChats(){
  const q = ($('searchInput').value || '').trim().toLowerCase();
  const box = $('panelChats');
  const list = friends.slice().filter(f => {
    if (!q) return true;
    return `${f.display_name||''} ${f.username||''}`.toLowerCase().includes(q);
  }).sort((a,b) => {
    const ta = a.last_message_at ? new Date(a.last_message_at).getTime() : 0;
    const tb = b.last_message_at ? new Date(b.last_message_at).getTime() : 0;
    return tb - ta;
  });
  if (!list.length){
    box.innerHTML = '<div class="hint">No conversations yet. <a href="friends.html" style="color:var(--accent);font-weight:600">Find people →</a></div>';
    return;
  }
  box.innerHTML = list.map(f => {
    const u = unread.get(Number(f.id)) || 0;
    const on = online.get(Number(f.id)) === 'online';
    const last = f.last_message || '';
    const ts = f.last_message_at ? new Date(f.last_message_at).getTime() : 0;
    return `<div class="conv-item" data-type="friend" data-id="${f.id}">
      <div style="position:relative">${avatarHtml(f.display_name||f.username, f.avatar_url||f.avatar_base64)}${statusDot(on?'online':'offline')}</div>
      <div class="conv-info">
        <div class="conv-name">${esc(f.display_name||f.username)}</div>
        <div class="conv-sub ${u?'unread':''}">${esc(last || '@'+f.username)}</div>
      </div>
      <div class="conv-side">
        ${ts ? `<span class="conv-time">${timeAgo(ts)}</span>` : ''}
        ${u ? `<span class="badge">${u>99?'99+':u}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  updateBadges();
}
function renderGroups(){
  const q = ($('searchInput').value || '').trim().toLowerCase();
  const box = $('panelGroups');
  const list = groups.filter(g => !q || (g.name||'').toLowerCase().includes(q));
  if (!list.length){
    box.innerHTML = '<div class="hint">You are not in any groups yet. Create one from <a href="friends.html" style="color:var(--accent);font-weight:600">Network</a>.</div>';
    return;
  }
  box.innerHTML = list.map(g => {
    const u = groupUnread.get(Number(g.id)) || 0;
    return `<div class="conv-item" data-type="group" data-id="${g.id}">
      <div class="avatar group-av"><i class="fas fa-users"></i></div>
      <div class="conv-info">
        <div class="conv-name">${esc(g.name)}</div>
        <div class="conv-sub ${u?'unread':''}">${Number(g.member_count)||0} members</div>
      </div>
      <div class="conv-side">
        ${u ? `<span class="badge">${u>99?'99+':u}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  updateBadges();
}
function renderRequests(){
  const box = $('panelRequests');
  if (!requests.length){
    box.innerHTML = '<div class="hint">No pending requests.</div>';
    return;
  }
  box.innerHTML = requests.map(r => `
    <div class="req-item">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        ${avatarHtml(r.display_name||r.username, r.avatar_url||r.avatar_base64)}
        <span class="req-name">@${esc(r.username)}</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-accent btn-sm req-accept" data-id="${r.id}"><i class="fas fa-check"></i></button>
        <button class="btn btn-ghost btn-sm req-decline" data-id="${r.id}"><i class="fas fa-times"></i></button>
      </div>
    </div>`).join('');
  updateBadges();
}
function updateBadges(){
  const totalUnread = [...unread.values()].reduce((a,b)=>a+(Number(b)||0),0);
  const chatsEl = $('chatsBadge');
  chatsEl.textContent = totalUnread; chatsEl.style.display = totalUnread ? 'inline-block' : 'none';
  const reqEl = $('reqBadge');
  reqEl.textContent = requests.length; reqEl.style.display = requests.length ? 'inline-block' : 'none';
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.list-panel').forEach(p => p.classList.remove('visible'));
  $('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('visible');
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

$('searchInput').addEventListener('input', debounce(() => { renderChats(); renderGroups(); }, 200));

/* sidebar click */
$('sidebar').addEventListener('click', e => {
  const item = e.target.closest('.conv-item');
  if (item){ openChat(item.dataset.type, item.dataset.id); return; }
  const acc = e.target.closest('.req-accept');
  if (acc){ respondRequest(acc.dataset.id, true); return; }
  const dec = e.target.closest('.req-decline');
  if (dec){ respondRequest(dec.dataset.id, false); return; }
});
async function respondRequest(id, accept){
  try {
    await api(`/api/friends/${accept?'accept':'decline'}/${id}`, { method:'PUT' });
    showToast(accept ? 'Request accepted' : 'Request declined');
    await Promise.all([loadFriends(), loadRequests()]);
  } catch(e){ showToast(e.message || 'Failed', 'error'); }
}

/* =========================================================
   LOADERS
   ========================================================= */
async function loadProfile(){
  try {
    const u = await api('/profile');
    me = { id: u.id, username: u.username, display_name: u.display_name || u.username };
    store.set('sarveik_me', me);
    if (u.coins != null) { $('coinsChip').style.display = 'inline-flex'; $('coinsChip').innerHTML = `<i class="fas fa-coins"></i> ${u.coins}`; }
    if (u.level != null) { $('levelChip').style.display = 'inline-flex'; $('levelChip').innerHTML = `<i class="fas fa-star"></i> Lv ${u.level}`; }
    fixMessageSides();   // <— the rescue pass for messages painted before profile resolved
  } catch(_){}
}
async function loadFriends(){
  try {
    friends = await api('/api/friends') || [];
    friends.forEach(f => { if (f.status) online.set(Number(f.id), f.status); });
    renderChats();
  } catch(e){ $('panelChats').innerHTML = `<div class="hint">${esc(e.message)}</div>`; }
}
async function loadGroups(){
  try {
    groups = await api('/api/groups') || [];
    renderGroups();
  } catch(_){}
}
async function loadRequests(){
  try {
    const all = await api('/api/friends/requests') || [];
    requests = all;
    renderRequests();
  } catch(_){}
}
async function loadUnread(){
  try {
    const d = await api('/api/unread');
    unread.clear();
    (d.unread || []).forEach(u => unread.set(Number(u.friend_id), Number(u.count) || 0));
    renderChats();
  } catch(_){}
}

/* =========================================================
   OPEN CHAT
   ========================================================= */
async function openChat(type, id){
  type = type === 'group' ? 'group' : 'friend';
  if (currentType === type && String(currentId) === String(id)) return;
  currentType = type; currentId = id; currentIsGroup = (type === 'group');
  messages = []; renderedIds.clear(); pendingByTemp.clear();
  oldestTs = null; replyTarget = null; hideReplyPreview(); hideTyping();
  messagesArea.innerHTML = '';

  document.body.classList.add('chat-open');

  // header
  let name = '', avatarUrl = null, statusText = 'Offline', isOnline = false;
  if (currentIsGroup){
    const g = groups.find(x => String(x.id) === String(id));
    name = g ? g.name : 'Group';
    $('chatAvatar').innerHTML = '<i class="fas fa-users"></i>';
    statusText = `${Number(g && g.member_count) || 0} members`;
  } else {
    const f = friends.find(x => String(x.id) === String(id));
    name = f ? (f.display_name || f.username) : 'Chat';
    avatarUrl = f && (f.avatar_url || f.avatar_base64);
    isOnline = online.get(Number(id)) === 'online';
    statusText = isOnline ? 'Online' : 'Offline';
    $('chatAvatar').innerHTML = avatarUrl ? `<img src="${esc(avatarUrl)}" alt="">` : esc(initial(name));
  }
  currentName = name; currentAvatarUrl = avatarUrl;
  $('chatName').textContent = name;
  const st = $('chatStatus');
  st.innerHTML = currentIsGroup
    ? `<i class="fas fa-users" style="font-size:.65rem"></i> ${esc(statusText)}`
    : `<span class="dot-online ${isOnline?'':'off'}"></span> ${esc(statusText)}`;
  $('statusPill').innerHTML = currentIsGroup
    ? `<span class="pulse${isOnline?'':' off'}"></span> Group`
    : `<span class="pulse${isOnline?'':' off'}"></span> ${isOnline?'Online':'Offline'}`;
  document.title = name + ' – Sarveik';

  msgInput.disabled = false;
  updateSendState();

  // active row
  document.querySelectorAll('.conv-item').forEach(el => {
    el.classList.toggle('active', el.dataset.type === type && String(el.dataset.id) === String(id));
  });

  // clear unread
  if (currentIsGroup) groupUnread.delete(Number(id)); else unread.delete(Number(id));
  renderChats(); renderGroups();
  markRead();

  // load history
  showLoading();
  try {
    const url = currentIsGroup
      ? `/api/groups/${id}/messages?limit=50`
      : `/api/messages/${id}?limit=50`;
    const raw = await api(url);
    const arr = Array.isArray(raw) ? raw : (raw.messages || raw.data || []);
    arr.forEach(m => {
      const n = normMsg(m);
      if (!n) return;
      if (n.id != null) { if (renderedIds.has(String(n.id))) return; renderedIds.add(String(n.id)); }
      messages.push(n);
    });
    messages.sort((a,b) => tsOf(a) - tsOf(b));
    if (messages.length) oldestTs = tsOf(messages[0]);
    renderMessages();
  } catch(e){
    messagesArea.innerHTML = `<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div><h3>Could not load messages</h3><p>${esc(e.message)}</p></div>`;
  }
  scrollBottom(true);
}

function showLoading(){
  messagesArea.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3)"><i class="fas fa-spinner fa-spin"></i></div>';
}
async function markRead(){
  try {
    if (currentIsGroup) await api(`/api/groups/${currentId}/read`, { method:'POST' });
    else await api(`/api/messages/read/${currentId}`, { method:'POST' });
  } catch(_){}
}

/* =========================================================
   RENDER MESSAGES
   ========================================================= */
function bubbleInner(m, senderName){
  let html = '';
  if (m.reply && (m.reply.text || m.reply.fromName)){
    const who = m.reply.fromName || (isMine(m) ? 'You' : senderName || 'Them');
    html += `<div class="reply-indicator" title="${esc(m.reply.text)}"><strong>${esc(who)}:</strong> ${esc(shortText(m.reply.text))}</div>`;
  }
  if (m.fileUrl){
    const ft = (m.fileType || '').toLowerCase();
    if (ft.startsWith('image/') || ft === 'image'){
      html += `<div class="msg-file photo"><img src="${esc(m.fileUrl)}" alt="" loading="lazy"></div>`;
    } else if (ft.startsWith('video/') || ft === 'video'){
      html += `<div class="msg-file"><video src="${esc(m.fileUrl)}" controls playsinline preload="metadata"></video></div>`;
    } else if (ft.startsWith('audio/') || ft === 'audio' || ft === 'voice'){
      html += `<div class="voice">
        <button class="voice-btn" type="button"><i class="fas fa-play"></i></button>
        <div class="voice-track" data-src="${esc(m.fileUrl)}">${'<i></i>'.repeat(30)}</div>
        <span class="voice-time">0:00</span>
        <audio preload="metadata" src="${esc(m.fileUrl)}" style="display:none"></audio>
      </div>`;
    } else {
      html += `<a class="msg-file" href="${esc(m.fileUrl)}" target="_blank" rel="noopener" style="text-decoration:none">
        <div class="file-icon"><i class="fas fa-file-alt"></i><span>${esc(m.fileName || 'File')}</span></div></a>`;
    }
  }
  if (m.message) html += `<span class="msg-text">${esc(m.message)}</span>`;
  if (m.boosted) html += `<span class="boost-badge"><i class="fas fa-bolt"></i></span>`;
  return html;
}
function shortText(t){ t = String(t||''); return t.length > 60 ? t.slice(0,60) + '…' : t; }
function statusIcon(m){
  if (m.status === 'sending') return '<i class="fas fa-spinner"></i>';
  if (m.status === 'failed')  return '<i class="fas fa-exclamation-circle"></i>';
  if (m.status === 'read' || m.seen) return '<i class="fas fa-check-double"></i>';
  if (m.status === 'delivered') return '<i class="fas fa-check-double"></i>';
  return '<i class="fas fa-check"></i>';
}
function senderNameOf(m){
  if (m.fromName) return m.fromName;
  const f = friends.find(x => String(x.id) === String(m.from));
  return f ? (f.display_name || f.username) : 'Member';
}
function messageHtml(m){
  const mine = isMine(m);
  const cls = ['msg', mine ? 'out' : 'in'];
  if (m.status === 'sending') cls.push('sending');
  if (m.boosted) cls.push('boosted');
  return `<div class="${cls.join(' ')}" data-id="${esc(m.id ?? m.tempId ?? '')}" data-from="${esc(m.from ?? '')}">
    <div class="msg-bubble">${bubbleInner(m, senderNameOf(m))}</div>
    <div class="msg-meta">
      <span class="msg-time">${esc(timeFmt(m.createdAt))}</span>
      ${mine ? `<span class="msg-status">${statusIcon(m)}</span>` : ''}
    </div>
    <div class="msg-actions">
      <button class="msg-act reply" title="Reply"><i class="fas fa-reply"></i></button>
      ${mine ? `<button class="msg-act boost" title="Boost"><i class="fas fa-bolt"></i></button>` : ''}
      ${mine ? `<button class="msg-act del" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
    </div>
  </div>`;
}
function renderMessages(){
  if (!messages.length){ messagesArea.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-comment-dots"></i></div><h3>Say hello 👋</h3><p>Be the first to write in this conversation.</p></div>'; return; }
  let html = '', lastDay = '';
  for (const m of messages){
    const dk = dayKey(m.createdAt);
    if (dk && dk !== lastDay){
      html += `<div style="align-self:center;font-size:.66rem;color:var(--text3);font-weight:600;padding:6px 12px;background:var(--surface2);border-radius:50px;margin:8px 0">${esc(dayLabel(m.createdAt))}</div>`;
      lastDay = dk;
    }
    html += messageHtml(m);
  }
  messagesArea.innerHTML = html;
  fixMessageSides(messagesArea);
}
function appendMessage(m, opts={}){
  if (m.id != null && renderedIds.has(String(m.id))) return false;
  if (m.id != null) renderedIds.add(String(m.id));
  const wasEmpty = !messagesArea.querySelector('.msg');
  if (wasEmpty) messagesArea.innerHTML = '';
  const nearBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 120;
  const tmp = document.createElement('div');
  tmp.innerHTML = messageHtml(m);
  const el = tmp.firstElementChild;
  messagesArea.appendChild(el);
  fixMessageSides(messagesArea);
  messages.push(m);
  if (!opts.silent && (nearBottom || isMine(m))) scrollBottom(true);
  return true;
}
function updateMessageStatus(id, status){
  const el = messagesArea.querySelector(`.msg[data-id="${id}"]`);
  if (!el) return;
  if (status === 'sending') el.classList.add('sending'); else el.classList.remove('sending');
  const s = el.querySelector('.msg-status');
  if (s) s.innerHTML = statusIcon({ status });
}
function replaceTemp(tempId, serverMsg){
  const el = messagesArea.querySelector(`.msg[data-id="${tempId}"]`);
  if (el && serverMsg.id != null){ el.dataset.id = serverMsg.id; renderedIds.add(String(serverMsg.id)); }
  const idx = messages.findIndex(x => String(x.id) === String(tempId));
  if (idx >= 0){ messages[idx] = { ...messages[idx], ...serverMsg, status: 'sent' }; }
  updateMessageStatus(serverMsg.id ?? tempId, 'sent');
}

/* =========================================================
   SEND
   ========================================================= */
function updateSendState(){
  const hasText = msgInput.value.trim().length > 0;
  sendBtn.disabled = !hasText || !currentType;
}
function autoGrow(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
}
msgInput.addEventListener('input', () => {
  autoGrow(); updateSendState();
  if (currentType) emitTyping();
});
msgInput.addEventListener('keydown', e => {
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  if (e.key === 'Enter' && !e.shiftKey && !coarse){
    e.preventDefault();
    if (!sendBtn.disabled) sendCurrent();
  }
});
sendBtn.addEventListener('click', sendCurrent);

function sendCurrent(){
  const text = msgInput.value.trim();
  if (!text || !currentType) return;
  msgInput.value = ''; autoGrow(); updateSendState();
  sendMessage({ message: text, replyTo: replyTarget });
  replyTarget = null; hideReplyPreview();
}

async function sendMessage({ message, fileUrl=null, fileType=null, fileName=null, replyTo=null }){
  if (!currentType) return;
  const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const optimistic = {
    id: tempId, tempId,
    from: myId(), fromName: me.display_name || me.username,
    to: currentIsGroup ? null : currentId,
    groupId: currentIsGroup ? currentId : null,
    message, fileUrl, fileType, fileName,
    createdAt: new Date().toISOString(),
    status: 'sending',
    reply: replyTo ? { id: replyTo.id, from: replyTo.from, fromName: replyTo.fromName, text: replyTo.message } : null
  };
  appendMessage(optimistic);
  pendingByTemp.set(tempId, optimistic);
  scrollBottom(true);

  try {
    const body = currentIsGroup
      ? { message, fileUrl, fileType, fileName, tempId, replyTo: replyTo && replyTo.id }
      : { to: currentId, message, fileUrl, fileType, fileName, tempId, replyTo: replyTo && replyTo.id };
    const url = currentIsGroup ? `/api/groups/${currentId}/messages` : '/api/messages';
    const saved = await api(url, { method:'POST', body });
    const norm = normMsg(saved || { id: tempId });
    if (norm && norm.id != null){
      replaceTemp(tempId, norm);
      // update conversation preview
      const f = friends.find(x => String(x.id) === String(currentId));
      if (f){ f.last_message = message || fileName || '📎 File'; f.last_message_at = new Date().toISOString(); renderChats(); }
    } else {
      updateMessageStatus(tempId, 'sent');
    }
  } catch(e){
    updateMessageStatus(tempId, 'failed');
    showToast(e.message || 'Failed to send', 'error');
  } finally {
    pendingByTemp.delete(tempId);
  }
}

/* =========================================================
   RECEIVE VIA SOCKET
   ========================================================= */
socket.on('private_message', data => {
  const m = normMsg(data);
  if (!m) return;
  const fromMe = myId() && m.from === myId();
  const relevant = currentType === 'friend' && (
    (fromMe && String(m.to) === String(currentId)) ||
    (!fromMe && String(m.from) === String(currentId))
  );
  // dedupe own echoes (we already inserted optimistically)
  if (fromMe && m.tempId && pendingByTemp.has(m.tempId)) return;
  if (fromMe && m.id != null && renderedIds.has(String(m.id))) return;

  // update conversation preview
  const other = fromMe ? m.to : m.from;
  const f = friends.find(x => String(x.id) === String(other));
  if (f){
    f.last_message = m.message || m.fileName || '📎 File';
    f.last_message_at = m.createdAt || new Date().toISOString();
  }
  if (!fromMe){
    unread.set(Number(other), (unread.get(Number(other)) || 0) + 1);
    if (document.hidden || !document.hasFocus()) systemNotify('New message', `${f ? (f.display_name||f.username) : 'Someone'}: ${shortText(m.message || 'New message')}`, 'friend', other);
  }
  renderChats();

  if (relevant){
    appendMessage(m);
    if (!fromMe){ markRead(); unread.delete(Number(other)); renderChats(); }
  } else if (!fromMe){
    flashConv('friend', other);
  }
});

socket.on('group_message', data => {
  const m = normMsg(data);
  if (!m) return;
  const fromMe = myId() && m.from === myId();
  if (fromMe && m.tempId && pendingByTemp.has(m.tempId)) return;
  if (fromMe && m.id != null && renderedIds.has(String(m.id))) return;
  const gid = m.groupId;
  const relevant = currentType === 'group' && String(gid) === String(currentId);
  if (!fromMe && !relevant){
    groupUnread.set(Number(gid), (groupUnread.get(Number(gid)) || 0) + 1);
    renderGroups();
    const g = groups.find(x => String(x.id) === String(gid));
    if (document.hidden || !document.hasFocus()) systemNotify(g ? g.name : 'Group', `${senderNameOf(m)}: ${shortText(m.message || 'New message')}`, 'group', gid);
  }
  if (relevant) appendMessage(m);
});

socket.on('user_status', d => {
  online.set(Number(d.userId), d.status || 'offline');
  renderChats();
  if (currentType === 'friend' && String(d.userId) === String(currentId)){
    const isOnline = d.status === 'online';
    $('chatStatus').innerHTML = `<span class="dot-online ${isOnline?'':'off'}"></span> ${isOnline?'Online':'Offline'}`;
    $('statusPill').innerHTML = `<span class="pulse${isOnline?'':' off'}"></span> ${isOnline?'Online':'Offline'}`;
  }
});

socket.on('typing', d => {
  if (!d) return;
  const from = normId(d.from ?? d.userId);
  const gid = normId(d.groupId);
  const relevant = (currentType === 'group' && gid && String(gid) === String(currentId))
    || (!gid && currentType === 'friend' && String(from) === String(currentId));
  if (!relevant) return;
  const who = d.fromName || (friends.find(x => String(x.id) === String(from))?.display_name) || 'Someone';
  showTyping(currentIsGroup ? `${who} is typing…` : 'typing…');
  clearTimeout(typingTimer);
  typingTimer = setTimeout(hideTyping, 3000);
});
socket.on('stop_typing', d => {
  if (!d) return;
  const gid = normId(d.groupId);
  const from = normId(d.from ?? d.userId);
  const relevant = (currentType === 'group' && gid && String(gid) === String(currentId))
    || (!gid && currentType === 'friend' && String(from) === String(currentId));
  if (relevant) hideTyping();
});

socket.on('message_seen', d => {
  if (!d) return;
  const ids = d.messageIds || (d.messageId ? [d.messageId] : []);
  ids.forEach(id => {
    const el = messagesArea.querySelector(`.msg[data-id="${id}"]`);
    if (el){ const s = el.querySelector('.msg-status'); if (s) s.innerHTML = '<i class="fas fa-check-double"></i>'; }
  });
});

socket.on('connect', () => { fixMessageSides(); });
socket.on('disconnect', () => { setTimeout(() => { if (!socket.connected) socket.connect(); }, 5000); });

function flashConv(type, id){
  const sel = `.conv-item[data-type="${type}"][data-id="${id}"]`;
  const el = document.querySelector(sel);
  if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* =========================================================
   TYPING (emit)
   ========================================================= */
function emitTyping(){
  const now = Date.now();
  if (now - lastTypingEmit < 2500) return;
  lastTypingEmit = now;
  const payload = currentIsGroup ? { groupId: currentId } : { to: currentId };
  socket.emit('typing', payload);
  clearTimeout(window.__typingStopTimer);
  window.__typingStopTimer = setTimeout(() => {
    socket.emit('stop_typing', payload);
  }, 2000);
}
function showTyping(text){
  const st = $('chatStatus');
  if (st){ st.classList.add('is-typing'); st.innerHTML = `<i class="fas fa-ellipsis-h"></i> ${esc(text)}`; }
}
function hideTyping(){
  if (currentType === 'friend'){
    const isOnline = online.get(Number(currentId)) === 'online';
    $('chatStatus').classList.remove('is-typing');
    $('chatStatus').innerHTML = `<span class="dot-online ${isOnline?'':'off'}"></span> ${isOnline?'Online':'Offline'}`;
  } else if (currentType === 'group'){
    const g = groups.find(x => String(x.id) === String(currentId));
    $('chatStatus').classList.remove('is-typing');
    $('chatStatus').innerHTML = `<i class="fas fa-users" style="font-size:.65rem"></i> ${Number(g && g.member_count)||0} members`;
  }
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */
function systemNotify(title, body, kind, id){
  if (permState() !== 'granted') return;
  try {
    const opts = { body, icon: currentAvatarUrl || '/icon-192.png', tag: kind + '-' + id, data:{ kind, id } };
    if (swReg && swReg.showNotification) swReg.showNotification(title, opts);
    else new Notification(title, opts);
  } catch(_){}
}

/* =========================================================
   REPLY / DELETE / BOOST / SHOW-ACTIONS
   ========================================================= */
function replyToMessage(m){
  replyTarget = m;
  const name = isMine(m) ? 'You' : senderNameOf(m);
  $('replyText').textContent = `${name}: ${shortText(m.message || m.fileName || 'Attachment')}`;
  $('replyPreview').classList.add('visible');
  msgInput.focus();
}
function hideReplyPreview(){ $('replyPreview').classList.remove('visible'); replyTarget = null; }
$('replyCancel').addEventListener('click', hideReplyPreview);

messagesArea.addEventListener('click', async e => {
  const btn = e.target.closest('.msg-act');
  if (btn){
    const msgEl = btn.closest('.msg');
    const id = msgEl && msgEl.dataset.id;
    const m = messages.find(x => String(x.id) === String(id) || String(x.tempId) === String(id));
    if (!m) return;
    if (btn.classList.contains('reply')) { replyToMessage(m); return; }
    if (btn.classList.contains('del')) { deleteMessage(m, msgEl); return; }
    if (btn.classList.contains('boost')) { boostMessage(m, msgEl); return; }
  }
  const msgEl = e.target.closest('.msg');
  if (msgEl && window.matchMedia('(pointer: coarse)').matches){
    document.querySelectorAll('.msg.show-actions').forEach(x => { if (x !== msgEl) x.classList.remove('show-actions'); });
    msgEl.classList.toggle('show-actions');
  }
  // reply-indicator jump
  const reply = e.target.closest('.reply-indicator');
  if (reply && reply.dataset.replyId){
    const target = messagesArea.querySelector(`.msg[data-id="${reply.dataset.replyId}"]`);
    if (target){ target.classList.add('hl'); target.scrollIntoView({ behavior:'smooth', block:'center' }); setTimeout(()=>target.classList.remove('hl'), 1600); }
  }
});

async function deleteMessage(m, el){
  const ok = confirm('Delete this message?');
  if (!ok) return;
  try {
    await api('/api/messages/' + m.id, { method:'DELETE' });
    el && el.remove();
    messages = messages.filter(x => String(x.id) !== String(m.id));
  } catch(e){ showToast(e.message || 'Delete failed', 'error'); }
}
async function boostMessage(m, el){
  try {
    await api('/api/messages/' + m.id + '/boost', { method:'POST' });
    if (el){
      el.classList.add('boosted');
      const b = el.querySelector('.msg-bubble');
      if (b && !b.querySelector('.boost-badge')) b.insertAdjacentHTML('beforeend', '<span class="boost-badge"><i class="fas fa-bolt"></i></span>');
    }
    showToast('Message boosted ⚡');
  } catch(e){ showToast(e.message || 'Boost failed', 'error'); }
}

/* =========================================================
   VOICE PLAYER
   ========================================================= */
messagesArea.addEventListener('click', e => {
  const track = e.target.closest('.voice-track');
  const btn   = e.target.closest('.voice-btn');
  const wrap  = e.target.closest('.voice');
  if (!wrap) return;
  const audio = wrap.querySelector('audio');
  const bars  = wrap.querySelectorAll('.voice-track i');
  const time  = wrap.querySelector('.voice-time');
  const btnEl = wrap.querySelector('.voice-btn');
  if (!audio) return;

  if (track && !isNaN(audio.duration) && audio.duration > 0){
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audio.currentTime = audio.duration * ratio;
    return;
  }
  if (btn || (track && (audio.paused === false))){
    if (audio.paused){ document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); }); audio.play(); btnEl && (btnEl.innerHTML = '<i class="fas fa-pause"></i>'); }
    else { audio.pause(); btnEl && (btnEl.innerHTML = '<i class="fas fa-play"></i>'); }
  }
});
messagesArea.addEventListener('timeupdate', e => {
  if (e.target.tagName !== 'AUDIO') return;
  const wrap = e.target.closest('.voice');
  if (!wrap) return;
  const bars = wrap.querySelectorAll('.voice-track i');
  const time = wrap.querySelector('.voice-time');
  const dur = e.target.duration || 0;
  const cur = e.target.currentTime || 0;
  const ratio = dur ? cur / dur : 0;
  bars.forEach((b, i) => b.classList.toggle('on', i / bars.length <= ratio));
  if (time) time.textContent = fmtSec(cur) + ' / ' + fmtSec(dur);
}, true);
messagesArea.addEventListener('ended', e => {
  if (e.target.tagName !== 'AUDIO') return;
  const wrap = e.target.closest('.voice');
  const btnEl = wrap && wrap.querySelector('.voice-btn');
  if (btnEl) btnEl.innerHTML = '<i class="fas fa-play"></i>';
}, true);
function fmtSec(s){ s = Math.floor(s || 0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

/* =========================================================
   FILE UPLOAD
   ========================================================= */
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file || !currentType) return;
  $('fileInput').value = '';
  const localBtn = $('attachBtn');
  const orig = localBtn.innerHTML; localBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; localBtn.disabled = true;
  try {
    const fd = new FormData(); fd.append('file', file);
    const res = await api('/api/upload', { method:'POST', body: fd });
    await sendMessage({ message:'', fileUrl: res.url || res.fileUrl, fileType: file.type, fileName: file.name });
  } catch(err){ showToast(err.message || 'Upload failed', 'error'); }
  localBtn.innerHTML = orig; localBtn.disabled = false;
});

/* =========================================================
   VOICE RECORDING
   ========================================================= */
$('recordBtn').addEventListener('click', async () => {
  if (!currentType) return;
  if (recorder && recorder.state === 'recording'){ stopRecording(true); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ showToast('Recording not supported', 'error'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recorder = new MediaRecorder(stream);
    recChunks = []; recStart = Date.now();
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer);
      $('recordBtn').classList.remove('recording');
      $('recordTime').textContent = '0:00';
      $('inputRow').classList.remove('recording');
      if (!recChunks.length) return;
      const blob = new Blob(recChunks, { type: recChunks[0].type || 'audio/webm' });
      const fd = new FormData();
      fd.append('file', blob, 'voice-' + Date.now() + '.webm');
      try {
        const res = await api('/api/upload', { method:'POST', body: fd });
        await sendMessage({ message:'', fileUrl: res.url || res.fileUrl, fileType: blob.type || 'audio/webm', fileName: 'Voice message' });
      } catch(e){ showToast(e.message || 'Upload failed', 'error'); }
    };
    recorder.start();
    $('recordBtn').classList.add('recording');
    $('inputRow').classList.add('recording');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recStart)/1000);
      $('recordTime').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    }, 250);
  } catch(e){ showToast('Microphone permission denied', 'error'); }
});
function stopRecording(upload){
  if (recorder && recorder.state === 'recording') recorder.stop();
}

/* =========================================================
   SCROLL HANDLING
   ========================================================= */
function scrollBottom(force){
  const el = messagesArea;
  if (force || el.scrollHeight - el.scrollTop - el.clientHeight < 200){
    el.scrollTop = el.scrollHeight;
    $('scrollBottomBtn').classList.remove('show');
    $('scrollBadge').style.display = 'none';
    $('scrollBadge').textContent = '0';
  }
}
messagesArea.addEventListener('scroll', () => {
  const el = messagesArea;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 160;
  $('scrollBottomBtn').classList.toggle('show', !nearBottom);
  if (nearBottom){ $('scrollBadge').style.display = 'none'; $('scrollBadge').textContent = '0'; }
  if (el.scrollTop < 60 && oldestTs && !loadingMore) loadOlder();
});
$('scrollBottomBtn').addEventListener('click', () => scrollBottom(true));

async function loadOlder(){
  if (!currentType || loadingMore) return;
  loadingMore = true;
  const prevH = messagesArea.scrollHeight;
  try {
    const url = currentIsGroup
      ? `/api/groups/${currentId}/messages?limit=50&before=${oldestTs}`
      : `/api/messages/${currentId}?limit=50&before=${oldestTs}`;
    const raw = await api(url);
    const arr = Array.isArray(raw) ? raw : (raw.messages || []);
    const fresh = [];
    arr.forEach(m => { const n = normMsg(m); if (n && (n.id == null || !renderedIds.has(String(n.id)))) { if (n.id!=null) renderedIds.add(String(n.id)); fresh.push(n); } });
    if (fresh.length){
      messages = fresh.concat(messages);
      oldestTs = tsOf(messages[0]);
      renderMessages();
      messagesArea.scrollTop = messagesArea.scrollHeight - prevH;
    }
  } catch(_){}
  loadingMore = false;
}

/* =========================================================
   CLEAR CHAT
   ========================================================= */
$('clearBtn').addEventListener('click', async () => {
  if (!currentType) return;
  if (!confirm('Clear this conversation on your device?')) return;
  try {
    await api(currentIsGroup ? `/api/groups/${currentId}/messages` : `/api/messages/${currentId}`, { method:'DELETE' });
  } catch(_){}
  messages = []; renderedIds.clear();
  messagesArea.innerHTML = '';
  renderMessages();
  showToast('Chat cleared');
});

/* =========================================================
   MOBILE NAV
   ========================================================= */
$('backBtn').addEventListener('click', () => {
  document.body.classList.remove('chat-open');
  currentType = null; currentId = null; currentIsGroup = false;
  document.title = 'Sarveik Chat – Instant Messaging';
});

/* =========================================================
   CLICK OUTSIDE A PHOTO / VIDEO
   ========================================================= */
messagesArea.addEventListener('click', e => {
  const img = e.target.closest('.msg-file img');
  if (img){ window.open(img.src, '_blank', 'noopener'); }
});

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await fetchCsrf();
  await loadProfile();
  await Promise.all([loadFriends(), loadGroups(), loadRequests(), loadUnread()]);

  // open requested chat from URL (?friend= or ?group=)
  const params = new URLSearchParams(location.search);
  const friendId = params.get('friend');
  const groupId  = params.get('group');
  if (groupId) openChat('group', groupId);
  else if (friendId) openChat('friend', friendId);

  // periodic refresh of online status (in case socket missed some)
  setInterval(() => { loadUnread(); }, 30000);
})();
</script>
