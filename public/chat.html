<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#bae6fd" />
<title>Sarveik Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#bae6fd;--blue2:#0ea5e9;--green:#bbf7d0;--green2:#22c55e;--bg:#f0f9ff;--card:#fff;--soft:#e8f6ff;--line:#dbeafe;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--red:#ef4444;--grad:linear-gradient(135deg,#bae6fd,#bbf7d0);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{display:flex;height:100%;overflow:hidden}
/* sidebar */
.side{width:340px;min-width:340px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--grad)}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px}
.brand b{font-size:1.15rem;flex:1}
.ib{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:15px}
.ib:hover{background:#fff}
.search{padding:10px 12px}
.search input{width:100%;padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--soft);outline:0;font:inherit;font-size:.85rem}
.search input:focus{border-color:var(--blue2);background:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px;font-size:.78rem;font-weight:600;color:var(--text3);border-bottom:2px solid transparent}
.tab.on{color:var(--blue2);border-color:var(--green2)}
.tab i{font-style:normal;background:var(--green2);color:#fff;border-radius:10px;padding:0 6px;font-size:.62rem;margin-left:3px}
.list{flex:1;overflow-y:auto}
.panel{display:none}.panel.on{display:block}
.conv{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.conv:hover{background:var(--soft)}
.conv.on{background:linear-gradient(90deg,#e0f2fe,#ecfdf5)}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;color:#0369a1;flex-shrink:0}
.av.g{background:linear-gradient(135deg,#bbf7d0,#a7f3d0);color:#047857}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--green2);border:2px solid #fff}
.ci{flex:1;min-width:0}
.cn{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:.72rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ct{font-size:.65rem;color:var(--text3)}
.conv.has .ct{color:var(--green2);font-weight:700}
.bd{background:var(--green2);color:#fff;border-radius:10px;min-width:19px;padding:1px 6px;font-size:.65rem;font-weight:700;text-align:center}
.req{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f1f5f9;font-weight:600;font-size:.85rem}
.btn{padding:6px 12px;border-radius:8px;font-size:.75rem;font-weight:600;background:var(--blue2);color:#fff}
.btn.g{background:var(--green2)}.btn.l{background:var(--soft);color:var(--text2)}
.empty{padding:24px;text-align:center;color:var(--text3);font-size:.82rem}
.notif-bar{display:none;align-items:center;gap:8px;padding:8px 12px;background:#ecfdf5;border-bottom:1px solid #bbf7d0;font-size:.75rem}
.notif-bar.on{display:flex}.notif-bar span{flex:1}
.foot{padding:10px 12px;border-top:1px solid var(--line)}
.foot .btn{width:100%;padding:9px;background:var(--grad);color:#0c4a6e}
/* chat */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--grad);min-height:60px}
.hd .av{width:38px;height:38px}
.hn{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:.7rem;color:#0369a1}
.hl{flex:1;min-width:0}
.mob{display:none}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,#f0f9ff,#f0fdf4)}
.ph{margin:auto;text-align:center;color:var(--text3)}
.ph div{font-size:2.5rem}
.msg{display:flex;flex-direction:column;max-width:80%;position:relative}
.msg.out{align-self:flex-end;align-items:flex-end}.msg.in{align-self:flex-start;align-items:flex-start}
.bub{padding:8px 12px;border-radius:14px;font-size:.88rem;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.out .bub{background:linear-gradient(135deg,#bae6fd,#bbf7d0);border-bottom-right-radius:4px}
.in .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.sending .bub{opacity:.6}
.who{font-size:.68rem;font-weight:700;color:var(--blue2);margin-bottom:2px}
.rp{font-size:.72rem;color:var(--text2);border-left:3px solid var(--green2);background:rgba(255,255,255,.6);padding:2px 7px;margin-bottom:4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.mt{font-size:.6rem;color:var(--text3);padding:1px 4px}
.acts{display:none;position:absolute;top:-12px;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:1px 3px;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:2}
.out .acts{right:0}.in .acts{left:0}
.msg:hover .acts,.msg.show .acts{display:flex}
.acts button{width:24px;height:24px;font-size:.72rem;border-radius:50%}
.acts button:hover{background:var(--soft)}
.file{margin-top:5px;border-radius:10px;overflow:hidden;max-width:260px;cursor:pointer}
.file img,.file video{width:100%;max-height:240px;object-fit:cover;display:block}
.fdoc{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);padding:9px 12px;font-size:.78rem;border-radius:10px}
.typing{align-self:flex-start;font-size:.75rem;color:var(--text3);padding:4px 10px;background:#fff;border-radius:12px}
.more{align-self:center;padding:4px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:.72rem;color:var(--text2)}
/* input */
.inp{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.rpv{display:none;justify-content:space-between;background:var(--soft);border-left:3px solid var(--green2);padding:5px 10px;border-radius:6px;margin-bottom:6px;font-size:.75rem;color:var(--text2)}
.rpv.on{display:flex}
.row{display:flex;align-items:flex-end;gap:6px;background:var(--soft);border:1.5px solid var(--line);border-radius:22px;padding:5px 6px}
.row:focus-within{border-color:var(--blue2)}
.row textarea{flex:1;background:none;border:0;outline:0;resize:none;font:inherit;font-size:.9rem;max-height:100px;padding:6px 4px}
.tb{width:34px;height:34px;border-radius:50%;font-size:1rem;display:grid;place-items:center;position:relative;overflow:hidden}
.tb:hover{background:#fff}
.tb input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#4ade80);color:#fff;font-size:1rem}
.send:disabled{opacity:.4}
.prog{display:none;height:3px;background:var(--line);border-radius:2px;margin-bottom:6px}
.prog.on{display:block}.prog div{height:100%;width:30%;background:var(--green2);animation:pg 1s infinite}
@keyframes pg{to{margin-left:70%}}
.emo{position:fixed;bottom:80px;left:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50}
.emo button{font-size:1.2rem;padding:3px;border-radius:6px}.emo button:hover{background:var(--soft)}
/* modal & toast */
.mb{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.mb.on{display:flex}
.mc{background:#fff;border-radius:18px;padding:20px;width:min(420px,100%)}
.mc h3{margin-bottom:12px}
.mc input,.mc select{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px;outline:0}
.mc select{height:110px}
.toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:999}
.toast{background:#fff;border-left:4px solid var(--blue2);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:10px 14px;font-size:.8rem;max-width:300px;cursor:pointer;animation:ti .25s}
.toast.ok{border-color:var(--green2)}.toast.err{border-color:var(--red)}
@keyframes ti{from{transform:translateX(110%);opacity:0}}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
@media(max-width:768px){
.side{position:fixed;inset:0 auto 0 0;width:300px;min-width:300px;transform:translateX(-100%);transition:transform .25s;z-index:100}
.side.open{transform:none}.ov.open{display:block}
.mob{display:grid}.msg{max-width:90%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">💬</div><b>Sarveik Chat</b>
      <button class="ib" id="profileBtn" title="Profile">👤</button>
      <button class="ib" id="logoutBtn" title="Logout">⎋</button>
    </div>
    <div class="notif-bar" id="notifBar"><span>🔔 Turn on notifications to get messages instantly</span><button class="btn g" id="notifBtn">Enable</button></div>
    <div class="search"><input id="q" placeholder="Search…" autocomplete="off" /></div>
    <div class="tabs">
      <button class="tab on" data-t="F">Friends</button>
      <button class="tab" data-t="G">Groups</button>
      <button class="tab" data-t="R" id="tabR">Requests</button>
    </div>
    <div class="list">
      <div class="panel on" id="pF"></div>
      <div class="panel" id="pG"></div>
      <div class="panel" id="pR"><div class="empty">No pending requests</div></div>
    </div>
    <div class="foot"><button class="btn" id="newGroup">＋ Create Group</button></div>
  </aside>
  <div class="ov" id="ov"></div>

  <main class="main" id="main">
    <header class="hd">
      <button class="ib mob" id="menuBtn">☰</button>
      <div class="av" id="hAv">💬</div>
      <div class="hl"><div class="hn" id="hName">Select a chat</div><div class="hs" id="hSub"></div></div>
      <button class="ib" id="clearBtn" title="Clear chat" disabled>🗑</button>
      <button class="ib" id="homeBtn" title="Home">🏠</button>
    </header>
    <div class="msgs" id="msgs"><div class="ph"><div>💬</div><p>Choose a friend or group to start</p></div></div>
    <div class="inp">
      <div class="rpv" id="rpv"><span id="rpvT"></span><button id="rpvX">✕</button></div>
      <div class="prog" id="prog"><div></div></div>
      <div class="row">
        <button class="tb" id="emoBtn">😊</button>
        <button class="tb">📎<input type="file" id="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip,.xls,.xlsx,.ppt,.pptx" /></button>
        <textarea id="ta" rows="1" maxlength="1000" placeholder="Type a message…" disabled></textarea>
        <button class="send" id="send" disabled>➤</button>
      </div>
    </div>
  </main>
</div>

<div class="mb" id="gm"><div class="mc"><h3>Create Group</h3>
  <input id="gName" placeholder="Group name" />
  <select id="gMem" multiple></select>
  <div style="display:flex;gap:8px"><button class="btn l" id="gCancel" style="flex:1">Cancel</button><button class="btn g" id="gOk" style="flex:1">Create</button></div>
</div></div>
<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const esc=s=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIMIT=30;
const st={me:null,cur:null,friends:LS.get('nc_f',[]),groups:LS.get('nc_g',[]),unread:LS.get('nc_u',{}),act:LS.get('nc_a',{}),reply:null,offset:0,loading:false,hasMore:false,socket:null,tab:'F',q:'',typing:null,tt:null};
let csrf=null;

/* ---------- API ---------- */
async function api(url,o={}){
  const h={'Content-Type':'application/json'};
  if(o.method&&o.method!=='GET'){
    if(!csrf){csrf=(await (await fetch('/api/csrf-token',{credentials:'include'})).json()).csrfToken}
    h['X-CSRF-Token']=csrf;
  }
  const r=await fetch(url,{...o,credentials:'include',headers:{...h,...o.headers}});
  if(!r.ok)throw new Error(await r.text()||'Error');
  return (r.headers.get('content-type')||'').includes('json')?r.json():r.text();
}
function toast(m,t='info',fn){
  const e=document.createElement('div');e.className='toast '+t;e.textContent=m;
  if(fn)e.onclick=()=>{fn();e.remove()};
  $('toasts').appendChild(e);setTimeout(()=>e.remove(),3500);
}

/* ---------- Notifications (browser + mobile + sound) ---------- */
let actx=null;
function beep(){
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,actx.currentTime);o.frequency.setValueAtTime(1175,actx.currentTime+.09);
    g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);
    o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.25);
  }catch(_){}
}
const ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#bae6fd"/><text x="32" y="44" font-size="34" text-anchor="middle">💬</text></svg>');
async function showSystemNotif(title,body,tag,url){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opt={body,tag,icon:ICON,badge:ICON,renotify:true,vibrate:[120,60,120],data:{url}};
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(reg)return reg.showNotification(title,opt);
  }catch(_){}
  try{const n=new Notification(title,opt);n.onclick=()=>{window.focus();openFromUrl(url);n.close()}}catch(_){}
}
function updateTitle(){
  const n=Object.values(st.unread).reduce((a,b)=>a+b,0);
  document.title=(n?`(${n}) `:'')+'Sarveik Chat';
  if(navigator.setAppBadge){n?navigator.setAppBadge(n).catch(()=>{}):navigator.clearAppBadge().catch(()=>{})}
}
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function subscribePush(){ // true background push (needs server Web Push, see notes)
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
    const reg=await navigator.serviceWorker.ready;
    const {key}=await api('/api/push/public-key');if(!key)return;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    await api('/api/push/subscribe',{method:'POST',body:JSON.stringify(sub)});
  }catch(_){}
}
function checkNotifBar(){
  $('notifBar').classList.toggle('on','Notification' in window&&Notification.permission==='default');
}
$('notifBtn').onclick=async()=>{
  const p=await Notification.requestPermission();checkNotifBar();
  if(p==='granted'){toast('Notifications enabled 🔔','ok');subscribePush();showSystemNotif('Sarveik Chat','You will now get message alerts','welcome','/chat.html')}
};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='open-chat'||d.open)openFromUrl(d.open||(d.groupId?'/chat.html?group='+d.groupId:'/chat.html?friend='+d.friendId))});
}
function openFromUrl(u){
  try{const p=new URL(u,location.origin).searchParams;
    if(p.get('friend'))select('F'+p.get('friend'));else if(p.get('group'))select('G'+p.get('group'));}catch(_){}
}

/* ---------- Lists (sorted by latest chat activity) ---------- */
const saveU=()=>{LS.set('nc_u',st.unread);updateTitle()};
function touch(key,ts){st.act[key]=ts||Date.now();LS.set('nc_a',st.act);}
function ago(t){
  if(!t)return'';const d=new Date(t),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const days=Math.floor((n-d)/864e5);return days<7?(days<2?'Yesterday':d.toLocaleDateString([],{weekday:'short'})):d.toLocaleDateString([],{day:'2-digit',month:'short'});
}
function sorted(list,p){return [...list].sort((a,b)=>(st.act[p+b.id]||0)-(st.act[p+a.id]||0))}
function renderLists(){
  const q=st.q.toLowerCase();
  const f=sorted(st.friends,'F').filter(x=>!q||x.username.toLowerCase().includes(q));
  $('pF').innerHTML=f.length?f.map(x=>{
    const k='F'+x.id,u=st.unread[k]||0,t=st.act[k];
    return `<div class="conv ${st.cur===k?'on':''} ${u?'has':''}" data-k="${k}"><div class="av">${esc(x.username[0]).toUpperCase()}${x.online?'<span class="dot"></span>':''}</div><div class="ci"><div class="cn">${esc(x.username)}</div><div class="cs">${x.online?'● Online':'Tap to chat'}</div></div><div class="cm"><span class="ct">${t?ago(t):''}</span>${u?`<span class="bd">${u>99?'99+':u}</span>`:''}</div></div>`}).join(''):'<div class="empty">No friends found</div>';
  const g=sorted(st.groups,'G').filter(x=>!q||x.name.toLowerCase().includes(q));
  $('pG').innerHTML=g.length?g.map(x=>{
    const k='G'+x.id,u=st.unread[k]||0,t=st.act[k];
    return `<div class="conv ${st.cur===k?'on':''} ${u?'has':''}" data-k="${k}"><div class="av g">👥</div><div class="ci"><div class="cn">${esc(x.name)}</div><div class="cs">${x.member_count||''} members</div></div><div class="cm"><span class="ct">${t?ago(t):''}</span>${u?`<span class="bd">${u>99?'99+':u}</span>`:''}</div></div>`}).join(''):'<div class="empty">No groups yet</div>';
  const uf=st.friends.reduce((a,x)=>a+(st.unread['F'+x.id]||0),0),ug=st.groups.reduce((a,x)=>a+(st.unread['G'+x.id]||0),0);
  document.querySelector('[data-t=F]').innerHTML='Friends'+(uf?` <i>${uf}</i>`:'');
  document.querySelector('[data-t=G]').innerHTML='Groups'+(ug?` <i>${ug}</i>`:'');
}
['pF','pG'].forEach(id=>$(id).addEventListener('click',e=>{const c=e.target.closest('.conv');if(c)select(c.dataset.k)}));
$('q').oninput=e=>{st.q=e.target.value;renderLists()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['F','G','R'].forEach(k=>$('p'+k).classList.toggle('on',k===t.dataset.t));
});
function seedActivity(list,p){list.forEach(x=>{const t=x.last_message_at||x.lastMessageAt||x.last_activity;if(t){const v=new Date(t).getTime();if(v>(st.act[p+x.id]||0))st.act[p+x.id]=v}})}

async function loadFriends(){
  try{const d=await api('/api/friends');st.friends=d.map(f=>({...f,online:f.status==='online'}));seedActivity(st.friends,'F');LS.set('nc_f',st.friends);LS.set('nc_a',st.act);renderLists()}catch(_){}
}
async function loadGroups(){
  try{st.groups=await api('/api/groups');seedActivity(st.groups,'G');LS.set('nc_g',st.groups);LS.set('nc_a',st.act);renderLists()}catch(_){}
}
async function loadRequests(){
  try{
    const r=await api('/api/friends/requests');
    $('tabR').innerHTML='Requests'+(r.length?` <i>${r.length}</i>`:'');
    $('pR').innerHTML=r.length?r.map(x=>`<div class="req"><span>${esc(x.username)}</span><span><button class="btn g" data-a="acc" data-id="${x.id}">✓</button> <button class="btn l" data-a="dec" data-id="${x.id}">✕</button></span></div>`).join(''):'<div class="empty">No pending requests</div>';
  }catch(_){}
}
$('pR').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  try{await api(`/api/friends/${b.dataset.a==='acc'?'accept':'decline'}/${b.dataset.id}`,{method:'PUT'});
    toast(b.dataset.a==='acc'?'Friend added 🎉':'Declined','ok');loadRequests();loadFriends()}catch(x){toast(x.message,'err')}
};

/* groups */
$('newGroup').onclick=async()=>{
  $('gMem').innerHTML=st.friends.map(f=>`<option value="${f.id}">${esc(f.username)}</option>`).join('')||'<option disabled>No friends</option>';
  $('gm').classList.add('on');
};
$('gCancel').onclick=()=>$('gm').classList.remove('on');
$('gm').onclick=e=>{if(e.target===$('gm'))$('gm').classList.remove('on')};
$('gOk').onclick=async()=>{
  const name=$('gName').value.trim(),members=[...$('gMem').selectedOptions].map(o=>+o.value);
  if(!name)return toast('Enter a group name','err');
  try{await api('/api/groups',{method:'POST',body:JSON.stringify({name,members})});$('gName').value='';$('gm').classList.remove('on');toast('Group created 🎉','ok');loadGroups()}catch(e){toast(e.message,'err')}
};

/* ---------- Select conversation ---------- */
const isG=k=>k&&k[0]==='G',idOf=k=>+k.slice(1);
async function select(key){
  if(!key||st.cur===key)return;
  const sock=st.socket;
  if(isG(st.cur)&&sock)sock.emit('leave_group',idOf(st.cur));
  st.cur=key;st.reply=null;$('rpv').classList.remove('on');
  const id=idOf(key);
  if(isG(key)){
    const g=st.groups.find(x=>x.id===id);
    $('hAv').textContent='👥';$('hName').textContent=g?g.name:'Group';$('hSub').textContent=g?`${g.member_count} members`:'';
    sock&&sock.emit('join_group',id);
  }else{
    const f=st.friends.find(x=>x.id===id);
    $('hAv').textContent=f?f.username[0].toUpperCase():'?';$('hName').textContent=f?f.username:'Chat';$('hSub').textContent=f&&f.online?'Online':'Offline';
  }
  $('ta').disabled=$('send').disabled=false;$('clearBtn').disabled=isG(key);
  delete st.unread[key];saveU();renderLists();
  try{navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:'clear-notifications',tag:'msg-'+(isG(key)?'g':'f')+id})}catch(_){}
  $('msgs').innerHTML='<div class="ph"><p>Loading…</p></div>';
  await loadMsgs(true);
  if(!isG(key))api(`/api/messages/read/${id}`,{method:'POST'}).catch(()=>{});
  closeSide();$('ta').focus();
}

/* ---------- Messages ---------- */
const FILE_ICON=t=>t.includes('pdf')?'📕':t.includes('word')||t.includes('doc')?'📘':t.includes('sheet')||t.includes('excel')?'📗':t.includes('zip')?'🗜':'📄';
function fileHTML(m){
  const t=m.fileType||'',d=m.fileData;if(!d)return'';
  if(t.startsWith('image/'))return `<div class="file" data-open="${esc(d)}"><img loading="lazy" decoding="async" src="${esc(d)}" alt=""></div>`;
  if(t.startsWith('video/'))return `<div class="file"><video src="${esc(d)}" controls preload="none"></video></div>`;
  return `<div class="file" data-dl="${esc(d)}" data-name="${esc(m.fileName||'file')}"><div class="fdoc">${FILE_ICON(t)} <span>${esc(m.fileName||'file')}</span></div></div>`;
}
function msgHTML(m,pending){
  const me=m.sender_id===st.me,id=m.id;
  const rp=m.replyTo?(typeof m.replyTo==='object'?m.replyTo.content:'Replied message'):'';
  const who=!me&&isG(st.cur)?`<div class="who">${esc(m.username||(st.friends.find(f=>f.id===m.sender_id)||{}).username||'Member')}</div>`:'';
  const isFile=!!m.fileData;
  return `<div class="msg ${me?'out':'in'} ${pending?'sending':''}" data-id="${id}" ${pending?`data-temp="${id}"`:''}>
<div class="acts"><button data-a="reply" title="Reply">↩</button><button data-a="copy" title="Copy">⧉</button>${me?'<button data-a="del" title="Delete">🗑</button>':''}</div>
<div class="bub">${who}${rp?`<div class="rp">${esc(rp)}</div>`:''}${isFile?'':esc(m.content||'')}${fileHTML(m)}</div>
<div class="mt">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${me?(pending?' ⏳':' ✓'):''}</div></div>`;
}
const area=$('msgs');
const atBottom=()=>area.scrollHeight-area.scrollTop-area.clientHeight<120;
const toBottom=()=>{area.scrollTop=area.scrollHeight};
function appendMsg(m,pending){
  if(area.querySelector('.ph'))area.innerHTML='';
  if(!pending&&area.querySelector(`.msg[data-id="${m.id}"]`))return;
  const stick=atBottom();
  area.insertAdjacentHTML('beforeend',msgHTML(m,pending));
  if(stick||m.sender_id===st.me)toBottom();
}
async function loadMsgs(reset){
  if(st.loading)return;st.loading=true;
  const key=st.cur,id=idOf(key);
  try{
    if(reset){st.offset=0}
    const url=isG(key)?`/api/groups/${id}/messages`:`/api/messages/${id}`;
    const msgs=await api(`${url}?offset=${st.offset}&limit=${LIMIT}`);
    if(key!==st.cur)return;
    if(reset&&!msgs.length){area.innerHTML='<div class="ph"><div>👋</div><p>No messages yet — say hello!</p></div>';st.hasMore=false;return}
    const html=[...msgs].reverse().map(m=>msgHTML(m)).join('');
    st.hasMore=msgs.length>=LIMIT;
    if(reset){
      area.innerHTML=(st.hasMore?'<button class="more" id="more">↑ Load older</button>':'')+html;toBottom();
      const last=msgs[0];if(last&&last.created_at){const t=new Date(last.created_at).getTime();if(t>(st.act[key]||0)){touch(key,t);renderLists()}}
    }else{
      const old=area.scrollHeight;
      const mb=$('more');if(mb)mb.remove();
      area.insertAdjacentHTML('afterbegin',(st.hasMore?'<button class="more" id="more">↑ Load older</button>':'')+html);
      area.scrollTop=area.scrollHeight-old;
    }
    st.offset+=msgs.length;
  }catch(_){if(reset)area.innerHTML='<div class="ph"><p>Failed to load</p></div>'}
  finally{st.loading=false}
}
area.addEventListener('click',e=>{
  if(e.target.id==='more')return loadMsgs(false);
  const o=e.target.closest('[data-open]');if(o)return window.open(o.dataset.open,'_blank');
  const d=e.target.closest('[data-dl]');if(d){const a=document.createElement('a');a.href=d.dataset.dl;a.download=d.dataset.name;a.click();return}
  const msg=e.target.closest('.msg');if(!msg)return;
  const b=e.target.closest('[data-a]');
  if(!b){document.querySelectorAll('.msg.show').forEach(x=>x!==msg&&x.classList.remove('show'));msg.classList.toggle('show');return}
  const id=+msg.dataset.id,txt=msg.querySelector('.bub').textContent.trim();
  if(id<0)return toast('Still sending…');
  if(b.dataset.a==='reply'){st.reply={id,content:txt.slice(0,80)||'media'};$('rpvT').textContent='↩ '+(txt.slice(0,60)||'media');$('rpv').classList.add('on');$('ta').focus()}
  else if(b.dataset.a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('Copied','ok'))}
  else if(b.dataset.a==='del'){
    if(!confirm('Delete this message?'))return;
    api(`/api/messages/${id}`,{method:'DELETE'}).then(()=>{msg.remove();toast('Deleted')}).catch(x=>toast(x.message,'err'));
  }
});
$('rpvX').onclick=()=>{st.reply=null;$('rpv').classList.remove('on')};
$('clearBtn').onclick=async()=>{
  if(st.cur===null||isG(st.cur)||!confirm('Clear all messages? This cannot be undone.'))return;
  try{await api(`/api/messages/clear/${idOf(st.cur)}`,{method:'DELETE'});area.innerHTML='<div class="ph"><div>🧹</div><p>Chat cleared</p></div>';toast('Chat cleared')}catch(e){toast(e.message,'err')}
};

/* ---------- Send ---------- */
function emitMsg(payload){
  const id=idOf(st.cur);
  if(isG(st.cur))st.socket.emit('group_message',{groupId:id,...payload});
  else st.socket.emit('private_message',{to:id,...payload});
}
function send(){
  const ta=$('ta'),txt=ta.value.trim();
  if(!txt||!st.cur)return;
  if(!st.socket||!st.socket.connected)return toast('Reconnecting… try again','err');
  const tempId=-Date.now();
  const rp=st.reply;
  appendMsg({id:tempId,sender_id:st.me,content:txt,created_at:new Date().toISOString(),replyTo:rp},true);
  emitMsg({message:txt,replyTo:rp?rp.id:null,tempId});
  touch(st.cur);renderLists();
  ta.value='';ta.style.height='auto';st.reply=null;$('rpv').classList.remove('on');
}
$('send').onclick=send;
$('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('ta').addEventListener('input',e=>{
  e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px';
  if(st.cur&&!isG(st.cur)&&st.socket){
    st.socket.emit('typing',{to:idOf(st.cur),isTyping:true});
    clearTimeout(st.tt);st.tt=setTimeout(()=>st.socket.emit('typing',{to:idOf(st.cur),isTyping:false}),1000);
  }
});

/* ---------- Files ---------- */
function readURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function compress(f,max=1000,q=.72){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
  img.onerror=rej;img.src=u})}
async function handleFiles(files){
  if(!st.cur)return toast('Select a chat first','err');
  if(!st.socket||!st.socket.connected)return toast('Reconnecting…','err');
  for(const f of files){
    if(f.size>8*1024*1024){toast(f.name+' is over 8MB','err');continue}
    $('prog').classList.add('on');
    try{
      const data=f.type.startsWith('image/')&&f.size>1024*1024?await compress(f):await readURL(f);
      const type=data.startsWith('data:image/jpeg')&&f.type.startsWith('image/')?'image/jpeg':f.type;
      const tempId=-Date.now()-Math.random();
      const m={id:tempId,sender_id:st.me,content:f.name,created_at:new Date().toISOString(),fileData:data,fileType:type,fileName:f.name,fileSize:f.size};
      appendMsg(m,true);
      emitMsg({message:f.name,fileData:data,fileType:type,fileName:f.name,fileSize:f.size,replyTo:null,tempId});
      touch(st.cur);renderLists();
    }catch(e){toast('Could not process '+f.name,'err')}
    $('prog').classList.remove('on');
  }
}
$('file').onchange=e=>{if(e.target.files.length)handleFiles([...e.target.files]);e.target.value=''};
const mainEl=$('main');
mainEl.addEventListener('dragover',e=>e.preventDefault());
mainEl.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)handleFiles([...e.dataTransfer.files])});
$('ta').addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();handleFiles(fs)}});

/* ---------- Emoji ---------- */
const EM='😀😂🤣😊😍🥰😘😎🤩🥳😏😢😭😡🤔🙄😴🤗👍👎👏🙌🙏💪👀🎉🔥✨⭐💯❤️💙💚🧡💜🌈☀️🌙🍕🎂☕🚀'.match(/\p{Extended_Pictographic}(\uFE0F)?/gu);
$('emoBtn').onclick=e=>{
  e.stopPropagation();
  const old=$('emo');if(old)return old.remove();
  const p=document.createElement('div');p.id='emo';p.className='emo';
  p.innerHTML=EM.map(x=>`<button>${x}</button>`).join('');
  p.onclick=ev=>{const b=ev.target.closest('button');if(b){$('ta').value+=b.textContent;$('ta').focus();p.remove()}};
  document.body.appendChild(p);
  setTimeout(()=>document.addEventListener('click',()=>p.remove(),{once:true}),0);
};

/* ---------- Incoming messages ---------- */
function preview(m){return m.fileData||m.fileName?'📎 '+(m.fileName||'File'):(m.message||'').slice(0,120)}
function onIncoming(kind,cid,m,senderName){
  const key=kind+cid,ts=m.timestamp?new Date(m.timestamp).getTime():Date.now();
  touch(key,ts);
  const open=st.cur===key;
  if(open){
    appendMsg({id:m.id||('r'+Date.now()),sender_id:m.from,content:m.message||'',created_at:m.timestamp||new Date().toISOString(),fileData:m.fileData,fileType:m.fileType,fileName:m.fileName,fileSize:m.fileSize,replyTo:m.replyTo?{id:m.replyTo,content:'Replied message'}:null,username:senderName});
    if(kind==='F')api(`/api/messages/read/${cid}`,{method:'POST'}).catch(()=>{});
  }
  if(!(open&&!document.hidden)){
    st.unread[key]=(st.unread[key]||0)+1;saveU();beep();
    const title=kind==='G'?((st.groups.find(g=>g.id===cid)||{}).name||'Group'):senderName;
    const body=(kind==='G'?senderName+': ':'')+preview(m);
    const url=`/chat.html?${kind==='G'?'group':'friend'}=${cid}`,tag='msg-'+(kind==='G'?'g':'f')+cid;
    if(document.hidden)showSystemNotif(title,body,tag,url);
    else toast(`💬 ${title}: ${preview(m).slice(0,50)}`,'info',()=>select(key));
  }
  renderLists();
}
function confirmTemp(tempId,real){
  const el=area.querySelector(`.msg[data-temp="${tempId}"]`);if(!el)return;
  el.classList.remove('sending');el.removeAttribute('data-temp');
  if(real&&real.id)el.dataset.id=real.id;
  const mt=el.querySelector('.mt');if(mt)mt.textContent=mt.textContent.replace('⏳','✓');
}

/* ---------- Socket ---------- */
function initSocket(){
  const s=st.socket=io({withCredentials:true,transports:['websocket','polling']});
  s.on('connect',()=>{if(isG(st.cur))s.emit('join_group',idOf(st.cur));loadFriends()});
  s.on('private_message',m=>{
    if(m.from===st.me){if(m.tempId)confirmTemp(m.tempId,m.realMessage);return}
    const f=st.friends.find(x=>x.id===m.from);
    if(!f)loadFriends();
    onIncoming('F',m.from,m,f?f.username:(m.fromUsername||'New message'));
    if(m.tempId&&m.realMessage)confirmTemp(m.tempId,m.realMessage);
  });
  s.on('group_message',m=>{
    if(m.from===st.me){if(m.tempId)confirmTemp(m.tempId,m.realMessage);return}
    const f=st.friends.find(x=>x.id===m.from);
    onIncoming('G',m.groupId,m,f?f.username:(m.fromUsername||m.username||'Member'));
  });
  s.on('message_confirmed',d=>d.tempId&&confirmTemp(d.tempId,d.realMessage));
  s.on('user_status',d=>{
    const f=st.friends.find(x=>x.id===d.userId);if(!f)return;
    const on=d.status==='online';if(f.online===on)return;f.online=on;renderLists();
    if(st.cur==='F'+f.id)$('hSub').textContent=on?'Online':'Offline';
  });
  s.on('typing',d=>{
    const t=$('typingEl');
    if(st.cur==='F'+d.from&&d.isTyping){if(!t){const e=document.createElement('div');e.id='typingEl';e.className='typing';e.textContent='typing…';area.appendChild(e);if(atBottom())toBottom()}}
    else if(t)t.remove();
  });
  s.on('friend_request_notification',d=>{
    const n=d.fromUsername||'Someone';
    beep();loadRequests();loadFriends();
    document.hidden?showSystemNotif('Friend request',n+' sent you a friend request','req','/chat.html'):toast('📨 Request from '+n);
  });
  s.on('connection_accepted',d=>{beep();loadFriends();loadRequests();
    document.hidden?showSystemNotif('Friend request accepted',(d.fromUsername||'Someone')+' accepted your request','acc','/chat.html'):toast('🎉 '+(d.fromUsername||'Someone')+' accepted!','ok')});
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&st.cur&&st.unread[st.cur]){delete st.unread[st.cur];saveU();renderLists()}
});

/* ---------- Nav ---------- */
const closeSide=()=>{$('side').classList.remove('open');$('ov').classList.remove('open')};
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('ov').classList.add('open')};
$('ov').onclick=closeSide;
$('homeBtn').onclick=()=>location.href='/main.html';
$('profileBtn').onclick=()=>location.href='/profile.html';
$('logoutBtn').onclick=async()=>{if(confirm('Log out?')){try{await api('/logout',{method:'POST'})}catch(_){}location.href='/'}};

/* ---------- Init (cached lists paint instantly, network refreshes) ---------- */
renderLists();updateTitle();checkNotifBar();
(async()=>{
  try{
    const [sess,prof]=await Promise.all([api('/check-session'),api('/profile')]);
    if(!sess.loggedIn){location.href='/';return}
    st.me=prof.id;
  }catch(_){location.href='/';return}
  initSocket();
  loadFriends();loadGroups();loadRequests();
  if('Notification' in window&&Notification.permission==='granted')subscribePush();
  const p=new URLSearchParams(location.search);
  if(p.get('friend'))select('F'+p.get('friend'));else if(p.get('group'))select('G'+p.get('group'));
})();
})();
</script>
